<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Over - System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#363a3b",
                        "surface-container-low": "#191c1e",
                        "tertiary-container": "#ff7f8b",
                        "secondary": "#4ae176",
                        "inverse-on-surface": "#2d3133",
                        "surface-variant": "#323537",
                        "on-secondary-fixed": "#002109",
                        "tertiary-fixed": "#ffdadb",
                        "surface-container-highest": "#323537",
                        "surface-dim": "#101415",
                        "error": "#ffb4ab",
                        "surface-container-high": "#272a2c",
                        "on-secondary-container": "#004119",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#005321",
                        "surface-container": "#1d2022",
                        "surface-tint": "#4cd7f6",
                        "on-primary-fixed": "#001f26",
                        "secondary-fixed-dim": "#4ae176",
                        "primary-container": "#06b6d4",
                        "on-tertiary-fixed": "#40000d",
                        "inverse-surface": "#e0e3e5",
                        "inverse-primary": "#00687a",
                        "on-primary-container": "#00424f",
                        "on-secondary": "#003915",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "outline-variant": "#3d494c",
                        "error-container": "#93000a",
                        "outline": "#869397",
                        "on-surface": "#e0e3e5",
                        "on-tertiary-container": "#7d0023",
                        "surface-container-lowest": "#0b0f10",
                        "on-primary": "#003640",
                        "on-error": "#690005",
                        "secondary-container": "#00b954",
                        "tertiary": "#ffb2b7",
                        "on-tertiary": "#67001b",
                        "background": "#101415",
                        "on-background": "#e0e3e5",
                        "on-surface-variant": "#bcc9cd",
                        "primary-fixed": "#acedff",
                        "primary-fixed-dim": "#4cd7f6",
                        "primary": "#4cd7f6",
                        "surface": "#101415",
                        "on-primary-fixed-variant": "#004e5c",
                        "secondary-fixed": "#6bff8f",
                        "on-tertiary-fixed-variant": "#92002a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin": "24px",
                        "container-max": "1440px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "label-md": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "body-lg": ["Geist"],
                        "code-sm": ["JetBrains Mono"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg": ["40px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "code-sm": ["11px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .cyber-grid-bg {
            background-image: 
                linear-gradient(to right, #3d494c 1px, transparent 1px),
                linear-gradient(to bottom, #3d494c 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .neon-text-red {
            text-shadow: 0 0 5px theme('colors.error'), 0 0 10px theme('colors.error'), 0 0 20px theme('colors.error-container');
        }
        .neon-border-primary {
            box-shadow: 0 0 5px theme('colors.primary'), inset 0 0 5px theme('colors.primary');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex items-center justify-center font-body-md">
<!-- Background Matrix / Final Board State Simulation -->
<div class="absolute inset-0 z-0 opacity-20 cyber-grid-bg">
<!-- Simulated fallen blocks -->
<div class="absolute bottom-0 left-[64px] w-[96px] h-[32px] bg-primary border border-outline-variant"></div>
<div class="absolute bottom-[32px] left-[96px] w-[64px] h-[32px] bg-secondary border border-outline-variant"></div>
<div class="absolute bottom-0 left-[192px] w-[32px] h-[128px] bg-tertiary border border-outline-variant"></div>
<div class="absolute bottom-0 right-[128px] w-[64px] h-[64px] bg-surface-tint border border-outline-variant"></div>
<div class="absolute bottom-[64px] right-[160px] w-[96px] h-[32px] bg-error border border-outline-variant"></div>
</div>
<!-- Gradient Overlay to fade the board slightly -->
<div class="absolute inset-0 z-0 bg-gradient-to-t from-background via-transparent to-background opacity-80"></div>
<!-- Main Game Over Card -->
<main class="relative z-10 w-full max-w-md mx-margin bg-surface-container-low border border-outline-variant flex flex-col p-margin gap-margin shadow-[0_0_40px_rgba(0,0,0,0.8)] backdrop-blur-sm">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-error neon-text-red uppercase tracking-widest">Game Over</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit uppercase">System Halting...</p>
</div>
<!-- High Score Banner -->
<div class="bg-error-container border border-error py-unit px-unit text-center flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">trophy</span>
<span class="font-label-md text-label-md text-on-error-container uppercase tracking-widest">New High Score</span>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">trophy</span>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-2 gap-[1px] bg-outline-variant border border-outline-variant">
<!-- Final Score (Full Width) -->
<div class="col-span-2 bg-surface p-margin flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-unit">Final Score</span>
<span class="font-headline-lg text-headline-lg text-primary tracking-tighter">094,230</span>
</div>
<!-- Max Level -->
<div class="bg-surface p-unit flex flex-col items-center justify-center py-margin">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-unit">Max Level</span>
<span class="font-headline-md text-headline-md text-secondary tracking-tighter">14</span>
</div>
<!-- Total Lines -->
<div class="bg-surface p-unit flex flex-col items-center justify-center py-margin">
<span class="font-label-md text-label-md text-on-surface-variant uppercase mb-unit">Total Lines</span>
<span class="font-headline-md text-headline-md text-tertiary tracking-tighter">142</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-unit mt-unit">
<button class="w-full bg-primary text-on-primary border border-primary font-label-md text-label-md uppercase py-3 hover:bg-transparent hover:text-primary neon-border-primary transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">play_arrow</span>
                Play Again
            </button>
<div class="grid grid-cols-2 gap-unit">
<button class="bg-surface-variant text-on-surface-variant border border-outline-variant font-label-md text-label-md uppercase py-3 hover:bg-surface-bright hover:text-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">share</span>
                    Share Result
                </button>
<button class="bg-transparent text-on-surface-variant border border-outline-variant font-label-md text-label-md uppercase py-3 hover:border-error hover:text-error transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">logout</span>
                    Exit to Menu
                </button>
</div>
</div>
<!-- Decorative Bottom Element -->
<div class="flex justify-center mt-unit">
<div class="w-1/3 h-1 bg-outline-variant"></div>
</div>
</main>
</body></html>
